<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #1e1f22;
    color: #e3e5e8;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
  }

  .box {
    background: #2b2d31;
    border: 1px solid #3a3c41;
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .box h2 {
    font-size: 16px;
    margin-bottom: 12px;
    color: #ffffff;
  }

  .box p {
    font-size: 14px;
    color: #949ba4;
    line-height: 1.5;
  }

  .user-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .user-row img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #4a4d53;
  }

  .user-row .name {
    color: #ffffff;
    font-weight: 600;
    font-size: 15px;
  }

  .logout-btn {
    display: inline-block;
    margin-top: 8px;
    background: #4a4d53;
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
  }

  .logout-btn:hover {
    background: #da373c;
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="box" id="userBox">
    <p>Loading your account...</p>
  </div>

  <div class="box">
    <h2>Server Settings</h2>
    <p>This is where server config controls (like welcome channel) will go once connected to your bot's backend.</p>
  </div>

  <a href="index.html" class="logout-btn">Log out</a>

</div>

<script>
  
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const accessToken = params.get("access_token");
  const userBox = document.getElementById("userBox");

  if (!accessToken) {
    userBox.innerHTML = "<p>Not logged in. <a href='index.html' style='color:#5865F2;'>Go back and log in</a>.</p>";
  } else {
    fetch("https://discord.com/api/users/@me", {
      headers: { Authorization: `Bearer ${accessToken}` }
    })
      .then(res => res.json())
      .then(user => {
        const avatarUrl = user.avatar
          ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
          : "https://cdn.discordapp.com/embed/avatars/0.png";

        userBox.innerHTML = `
          <div class="user-row">
            <img src="${avatarUrl}" alt="avatar">
            <div>
              <div class="name">${user.username}</div>
              <div style="font-size:12px;color:#949ba4;">ID: ${user.id}</div>
            </div>
          </div>
        `;
      })
      .catch(() => {
        userBox.innerHTML = "<p>Could not load user info. Try logging in again.</p>";
      });
  }
</script>

</body>
</html>
