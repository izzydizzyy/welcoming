<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #1e1f22;
    color: #e3e5e8;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  .box {
    background: #2b2d31;
    border: 1px solid #3a3c41;
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 16px;
  }

  .box h2 { font-size: 16px; margin-bottom: 12px; color: #ffffff; }
  .box p.hint { font-size: 13px; color: #949ba4; margin-bottom: 14px; }

  .user-row { display: flex; align-items: center; gap: 12px; }
  .user-row img { width: 48px; height: 48px; border-radius: 50%; background: #4a4d53; }
  .user-row .name { color: #ffffff; font-weight: 600; font-size: 15px; }

  select, textarea, input[type=text] {
    width: 100%;
    background: #1e1f22;
    border: 1px solid #3a3c41;
    color: #e3e5e8;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    margin-bottom: 4px;
  }

  textarea { min-height: 90px; resize: vertical; }

  label.field-label {
    display: block;
    font-size: 12px;
    color: #949ba4;
    margin-bottom: 6px;
    margin-top: 14px;
  }
  label.field-label:first-child { margin-top: 0; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #3a3c41;
  }
  .toggle-row:last-child { border-bottom: none; }
  .toggle-row .cmd-name { font-size: 14px; }

  .switch { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #4a4d53; border-radius: 22px; transition: 0.15s;
  }
  .slider:before {
    content: ""; position: absolute; height: 16px; width: 16px;
    left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.15s;
  }
  .switch input:checked + .slider { background: #5865F2; }
  .switch input:checked + .slider:before { transform: translateX(18px); }

  .save-btn {
    background: #4a4d53;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
  }
  .save-btn:hover { background: #5865F2; }

  .status { font-size: 12px; margin-top: 8px; color: #949ba4; }
  .status.ok { color: #3ba55d; }
  .status.err { color: #da373c; }

  .logout-btn {
    display: inline-block;
    margin-top: 4px;
    color: #949ba4;
    font-size: 13px;
    text-decoration: none;
  }
  .logout-btn:hover { color: #da373c; }
</style>
</head>
<body>

<div class="wrap">

  <div class="box" id="userBox">
    <p>Loading your account...</p>
  </div>

  <div class="box" id="guildBox" style="display:none;">
    <h2>Select a Server</h2>
    <select id="guildSelect"></select>
  </div>

  <div id="settingsArea" style="display:none;">

    <div class="box">
      <h2>Welcome Message</h2>
      <p class="hint">Use {user}, {username}, or {server} as placeholders.</p>

      <label class="field-label">Welcome Channel</label>
      <select id="channelSelect"></select>

      <label class="field-label">Welcome Message</label>
      <textarea id="welcomeMessage"></textarea>

      <button class="save-btn" id="saveWelcome">Save Welcome Settings</button>
      <div class="status" id="welcomeStatus"></div>
    </div>

    <div class="box">
      <h2>Commands</h2>
      <p class="hint">Toggle which commands members can use in this server.</p>
      <div id="commandToggles"></div>
      <div class="status" id="commandStatus"></div>
    </div>

  </div>

  <a href="index.html" class="logout-btn">Log out</a>

</div>

<script>
  
  const API_URL = "http://localhost:3001";


  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  const accessToken = params.get("access_token");

  const userBox = document.getElementById("userBox");
  const guildBox = document.getElementById("guildBox");
  const guildSelect = document.getElementById("guildSelect");
  const settingsArea = document.getElementById("settingsArea");
  const channelSelect = document.getElementById("channelSelect");
  const welcomeMessage = document.getElementById("welcomeMessage");
  const commandToggles = document.getElementById("commandToggles");

  const COMMAND_LABELS = {
    ping: "/ping",
    serverinfo: "/serverinfo",
    userinfo: "/userinfo",
    avatar: "/avatar",
    say: "/say",
  };

  let currentGuildId = null;

  function authHeaders() {
    return { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" };
  }

  async function init() {
    if (!accessToken) {
      userBox.innerHTML = "<p>Not logged in. <a href='index.html' style='color:#5865F2;'>Go back and log in</a>.</p>";
      return;
    }

   
    const userRes = await fetch("https://discord.com/api/users/@me", {
      headers: { Authorization: `Bearer ${accessToken}` },
    });
    const user = await userRes.json();
    const avatarUrl = user.avatar
      ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
      : "https://cdn.discordapp.com/embed/avatars/0.png";

    userBox.innerHTML = `
      <div class="user-row">
        <img src="${avatarUrl}" alt="avatar">
        <div>
          <div class="name">${user.username}</div>
          <div style="font-size:12px;color:#949ba4;">ID: ${user.id}</div>
        </div>
      </div>
    `;

    
    const guildsRes = await fetch(`${API_URL}/api/guilds`, { headers: authHeaders() });
    if (!guildsRes.ok) {
      guildBox.style.display = "block";
      guildBox.innerHTML = "<p>Could not load servers. Make sure the bot's API is running and reachable.</p>";
      return;
    }
    const guilds = await guildsRes.json();

    if (guilds.length === 0) {
      guildBox.style.display = "block";
      guildBox.innerHTML = "<p>No shared servers found where you're an admin and the bot is present.</p>";
      return;
    }

    guildSelect.innerHTML = guilds.map((g) => `<option value="${g.id}">${g.name}</option>`).join("");
    guildBox.style.display = "block";
    settingsArea.style.display = "block";

    guildSelect.addEventListener("change", () => loadGuild(guildSelect.value));
    loadGuild(guilds[0].id);
  }

  async function loadGuild(guildId) {
    currentGuildId = guildId;

    const [configRes, channelsRes] = await Promise.all([
      fetch(`${API_URL}/api/guild/${guildId}/config`, { headers: authHeaders() }),
      fetch(`${API_URL}/api/guild/${guildId}/channels`, { headers: authHeaders() }),
    ]);

    const config = await configRes.json();
    const channels = await channelsRes.json();

    channelSelect.innerHTML = channels.map((c) => `<option value="${c.id}">#${c.name}</option>`).join("");
    if (config.welcomeChannel) channelSelect.value = config.welcomeChannel;
    welcomeMessage.value = config.welcomeMessage || "";

    commandToggles.innerHTML = Object.entries(COMMAND_LABELS)
      .map(([key, label]) => `
        <div class="toggle-row">
          <span class="cmd-name">${label}</span>
          <label class="switch">
            <input type="checkbox" data-cmd="${key}" ${config.commands[key] !== false ? "checked" : ""}>
            <span class="slider"></span>
          </label>
        </div>
      `)
      .join("");

   
    commandToggles.querySelectorAll("input[type=checkbox]").forEach((input) => {
      input.addEventListener("change", saveCommandToggles);
    });
  }

  async function saveCommandToggles() {
    const statusEl = document.getElementById("commandStatus");
    const commands = {};
    commandToggles.querySelectorAll("input[type=checkbox]").forEach((input) => {
      commands[input.dataset.cmd] = input.checked;
    });

    try {
      const res = await fetch(`${API_URL}/api/guild/${currentGuildId}/config`, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ commands }),
      });
      if (!res.ok) throw new Error();
      statusEl.textContent = "Saved.";
      statusEl.className = "status ok";
    } catch {
      statusEl.textContent = "Failed to save.";
      statusEl.className = "status err";
    }
  }

  document.getElementById("saveWelcome").addEventListener("click", async () => {
    const statusEl = document.getElementById("welcomeStatus");
    try {
      const res = await fetch(`${API_URL}/api/guild/${currentGuildId}/config`, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({
          welcomeChannel: channelSelect.value,
          welcomeMessage: welcomeMessage.value,
        }),
      });
      if (!res.ok) throw new Error();
      statusEl.textContent = "Saved.";
      statusEl.className = "status ok";
    } catch {
      statusEl.textContent = "Failed to save.";
      statusEl.className = "status err";
    }
  });

  init();
</script>

</body>
</html>
