<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Bot Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #1e1f22;
    color: #e3e5e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .box {
    background: #2b2d31;
    border: 1px solid #3a3c41;
    border-radius: 10px;
    padding: 40px 36px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }

  .box h1 {
    font-size: 20px;
    margin-bottom: 8px;
  }

  .box p {
    font-size: 14px;
    color: #949ba4;
    margin-bottom: 28px;
  }

  .login-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    background: #4a4d53;
    color: #ffffff;
    border: none;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
    text-decoration: none;
  }

  .login-btn:hover {
    background: #5865F2;
  }

  .footer-note {
    margin-top: 20px;
    font-size: 12px;
    color: #6d7178;
  }
</style>
</head>
<body>

  <div class="box">
    <h1>Welcome Bot Dashboard</h1>
    <p>Sign in with Discord to manage your server settings.</p>
    <a href="#" id="loginBtn" class="login-btn">Login with Discord</a>
    <div class="footer-note">You'll be redirected to Discord to authorize.</div>
  </div>

<script>
  // ---- Fill these in ----
  const CLIENT_ID = "1534227993965236524";
  const REDIRECT_URI = "https://izzydizzyy.github.io/welcoming/dashboard.html";
  const SCOPES = "identify guilds";
  // ------------------------

  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: "token",
    scope: SCOPES
  });

  document.getElementById("loginBtn").href =
    `https://discord.com/api/oauth2/authorize?${params.toString()}`;
</script>

</body>
</html>
